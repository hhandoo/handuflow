[DEFAULT]
system_name=HanduFLOW
environment=local

[STAGING_LAYER]
type=hive_metastore
schema=staging
table_prefix=t_stg__
table_suffix=__DO_NOT_DELETE
format=delta

[LOGGING]
type=standard
log_format=[%(asctime)s] [%(levelname)-8s] [%(name)s] [PID:%(process)d] [%(threadName)s] [%(module)s.%(funcName)s:%(lineno)d]: %(message)s
log_directory_name=logs
log_file_name=hf_log
backup_count=5
max_bytes=1048576
default_log_level=10
log_retention_days=7