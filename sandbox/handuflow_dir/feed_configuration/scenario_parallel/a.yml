feed_meta:
  unique_identifier: "a"
  pipeline: nightly_ingest
  depends_on:
    - "c"
  vacuum_hours: 168

load_details:
  type: "FULL_LOAD"

source:
  type: "hive_metastore"
  format: "delta"
  schema: "demo"
  table: "employee"

target:
  type: "hive_metastore"
  format: "delta"
  schema: "test"
  table: "parallel_customers"

feed_specs:
  primary_key: "id"
  custom_selection:
    enabled: false
  optimize_command:
    enabled: true
    where:
      year: 2025
      month: 7
    zorder_by:
      - customer_id
      - order_date

data_quality_checks:
  - check_group_identifier: "parallel_customers_dq"
    description: "Pre-load null check for parallel customers raw feed"
    run_type: "PRE_LOAD"
    column: "event_ts"
    checks:
      - name: "null_check"
