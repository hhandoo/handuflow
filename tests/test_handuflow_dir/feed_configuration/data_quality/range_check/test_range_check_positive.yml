feed_meta:
  unique_identifier: "employee12"
  upstream_identifier:
  downstream_identifier:
  vacuum_hours: 234

load_details:
  type: "FULL_LOAD"

source:
  type: "hive_metastore"
  format: "delta"
  schema: "demo"
  table: "employee12"

target:
  type: "hive_metastore"
  format: "delta"
  schema: "test"
  table: "test1"

feed_specs:
  primary_key: "id"
  composite_key:
    - "id"
    - "some_col"
    - "some_other_col"
  partition_columns:
    - "id"
    - "some_col"
  optimize_command:
    enabled: true
    where:
      year: 2025
      month: 7
    zorder_by:
      - customer_id
      - order_date
  custom_selection:
    - enabled: true
    - sql_file: test.sql
  enforce_schema:
    type: struct
    fields:
      - name: id
        type: integer
        nullable: false
        metadata:
          primaryKey: true
      - name: some_col
        type: string
        nullable: true
        metadata:
          description: Employee ID
          primaryKey: true
          sourceColumn: emp_id
      - name: some_other_col
        type: double
        nullable: true
        metadata: {}

data_quality_checks:
  - check_group_identifier: UNIQUE_GROUP_ID_1
    description: "Ensure there are no null, blank and duplicate values in the name column and that the values are within the specified threshold"
    run_type: PRE_LOAD
    dependency_datasets:
    column: event_ts
    checks:
      - name: range_check
        range:
          from_inc: "2026-07-01 00:00:00+05:30"
          to_exc: "2026-08-01 00:00:00+05:30"
          spark_timestamp_format: "yyyy-MM-dd HH:mm:ss.SSSXXX"

  - check_group_identifier: UNIQUE_GROUP_ID_2
    description: "Ensure there are no null, blank and duplicate values in the name column and that the values are within the specified threshold"
    run_type: PRE_LOAD
    dependency_datasets:
    column: age
    checks:
      - name: range_check
        range:
          from_inc: 10
          to_exc: 100

  - check_group_identifier: UNIQUE_GROUP_ID_3
    description: "Ensure there are no null, blank and duplicate values in the name column and that the values are within the specified threshold"
    run_type: PRE_LOAD
    dependency_datasets:
    column: name
    checks:
      - name: range_check
        range:
          from_inc: "john"
          to_exc: "kate"

  - check_group_identifier: UNIQUE_GROUP_ID_4
    description: "Ensure there are no null, blank and duplicate values in the name column and that the values are within the specified threshold"
    run_type: PRE_LOAD
    dependency_datasets:
    column: salary
    checks:
      - name: range_check
        range:
          from_inc: 1.0
          to_exc: 100000.0
