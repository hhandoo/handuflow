feed_meta:
  unique_identifier: "null_batch_key_feed"
  vacuum_hours: 168
  batch_key:

load_details:
  type: "FULL_LOAD"

source:
  type: "hive_metastore"
  format: "delta"
  schema: "demo"
  table: "employee"

