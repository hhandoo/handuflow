feed_specs:
  primary_key: "id"

data_quality_checks:
  - check_group_identifier: "group_null_batch_key"
    description: "Check with a null batch_key"
    run_type: "PRE_LOAD"
    column: "event_ts"
    checks:
      - name: "null_check"
