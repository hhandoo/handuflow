feed_meta:
  unique_identifier: "null_upstream_downstream_feed"
  vacuum_hours: 168
  upstream_identifier:
  downstream_identifier:

load_details:
  type: "FULL_LOAD"

source:
  type: "hive_metastore"
  format: "delta"
  schema: "demo"
  table: "employee"

target:
  type: "hive_metastore"
  format: "delta"
  schema: "demo"
  table: "employee_target"

feed_specs:
  primary_key: "id"

data_quality_checks:
  - check_group_identifier: "group_null_upstream_downstream"
    description: "Check with null upstream and downstream identifiers"
    run_type: "PRE_LOAD"
    column: "event_ts"
    checks:
      - name: "null_check"
